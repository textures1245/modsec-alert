# Hand-added lines found on EXTEEM-106 (2026-10-15 audit), appended to the
# legacy files to make a box that matches production, not just the repo copy.
# Format: "@@ <legacy file>" starts a block appended to that file.
@@ sec_actions.conf
# --- box hand-additions (EXTEEM-106 sec_actions.conf:198-228) ---
SecRule REQUEST_URI "@beginsWith /business-drive/" \
  "id:1000010,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=911100,ctl:ruleRemoveById=920340,ctl:ruleRemoveById=920640"
SecRule REQUEST_FILENAME "@streq /api/v2/client/get_activity_file" \
  "id:1000022,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942140;ARGS:json.path_file,ctl:ruleRemoveTargetById=942151;ARGS:json.path_file,ctl:ruleRemoveTargetById=942190;ARGS:json.path_file"
SecRule REQUEST_METHOD "@streq POST" "id:1000023,phase:1,pass,nolog,chain"
  SecRule REQUEST_FILENAME "@streq /onebox_uploads/api/check_duplicate_inbox" "ctl:ruleRemoveTargetById=942100;ARGS:json.header_info.Doc_remark1,ctl:ruleRemoveTargetById=942100;ARGS:json.header_info.BuyerLineTwo"
SecRule REQUEST_URI "@beginsWith /api/v2/client/using_file" "id:1000021,phase:1,pass,nolog,ctl:ruleRemoveTargetById=932370;ARGS:json.file_path_temp"
@@ sec_rule_removal.conf
# --- box hand-additions (EXTEEM-106 sec_rule_removal.conf:85-142) ---
SecRuleUpdateTargetById 942100 "!ARGS:json.filename,!ARGS:json.file_name,!ARGS:json.path"
SecRuleUpdateTargetById 942190 "!ARGS:json.filename,!ARGS:json.path_file"
SecRuleUpdateTargetById 942100 "!ARGS:json.something_not_in_patch"
