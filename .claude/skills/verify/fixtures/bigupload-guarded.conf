server {
    listen 8081;
    location /business-drive/ {
        client_max_body_size 5G;
        error_page 418 = @bd_nowaf;
        if ($bypass_waf) { return 418; }
        proxy_pass http://127.0.0.1:9000;
    }
    location @bd_nowaf {
        modsecurity on;
        modsecurity_rules 'SecRequestBodyAccess Off';
        client_max_body_size 5G;
        add_header X-Route nowaf always;
        proxy_pass http://127.0.0.1:9000;
    }
}
